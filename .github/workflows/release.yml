name: release

on:
  push:
    tags:
      - "v*"
      - "fe-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and attach assets for (for example fe-v0.0.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate and resolve release tag
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(fe-)?v[0-9]+\.[0-9]+\.[0-9]+([.+~:-][0-9A-Za-z.+~:-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$commit" != "$GITHUB_SHA" ]]; then
            echo "The pushed tag does not resolve to the event commit." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  binaries:
    needs: validate-release
    name: Build portable release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate-release.outputs.commit }}

      # Manual rebuilds of older tags may predate the shared build script.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: ${{ inputs.tag_name != '' }}
        with:
          ref: master
          path: .build-tools

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          if [ -f scripts/build-binaries.sh ]; then
            bash scripts/build-binaries.sh
          else
            bash .build-tools/scripts/build-binaries.sh
          fi

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  riscv-binary:
    needs: validate-release
    name: Build Linux RISC-V 64-bit binary on native hardware
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.10"
          cache: true

      - name: Test and build RISC-V binary
        run: |
          set -euo pipefail
          go test ./...
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -trimpath -ldflags="-s -w" -o dist/fe-linux-riscv64 .

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: fe-linux-riscv64
          path: dist/fe-linux-riscv64
          if-no-files-found: error
          retention-days: 1

  deb-packages:
    name: Build Debian packages
    needs: [validate-release, binaries]
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: binaries
          path: dist

      - name: Build Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+~:-][0-9A-Za-z.+~:-]*)?$'; then
            echo "Tag must contain a package-compatible version (for example v1.2.3); got $RELEASE_TAG" >&2
            exit 1
          fi
          bash scripts/package-linux.sh "$version"

      - name: Smoke-test clean amd64 Debian package install
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          package="./dist/packages/fe_${version}_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package" >/dev/null
          sudo apt-get install -y "$package"
          test "$(command -v fe)" = "/usr/bin/fe"
          dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' fe | grep -Fx "install ok installed ${version} amd64"
          fe --help >/dev/null
          fe o3de --help >/dev/null

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: deb-packages
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish GitHub Release assets
    permissions:
      contents: write
    needs: [validate-release, binaries, riscv-binary, deb-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: dist
          merge-multiple: true

      - name: Verify and checksum release assets
        run: |
          ls -lah dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 12
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 12
          cat dist/SHA256SUMS

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: Fe ${{ needs.validate-release.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  chocolatey:
    name: Package Fe for Chocolatey
    needs: [validate-release, binaries, github-release]
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      HAS_CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: binaries
          path: dist

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $version = $tag -replace '^(fe-)?v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag must be a Chocolatey-compatible version like v1.2.3; got $tag"
          }
          $binary = Resolve-Path "dist/fe-windows-amd64.exe"
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $stage = Join-Path $env:RUNNER_TEMP "fe-choco"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "tools") | Out-Null
          Copy-Item "packaging/chocolatey/fe.nuspec" (Join-Path $stage "fe.nuspec")
          Copy-Item "packaging/chocolatey/tools/chocolateyInstall.ps1" (Join-Path $stage "tools/chocolateyInstall.ps1")
          $nuspecPath = Join-Path $stage "fe.nuspec"
          $nuspec = (Get-Content $nuspecPath -Raw).Replace("__VERSION__", $version)
          Set-Content -Path $nuspecPath -Value $nuspec -NoNewline
          $installPath = Join-Path $stage "tools/chocolateyInstall.ps1"
          $install = (Get-Content $installPath -Raw).Replace("__TAG__", $tag).Replace("__SHA256__", $hash)
          Set-Content -Path $installPath -Value $install -NoNewline
          choco pack $nuspecPath --outputdirectory .
          if (!(Test-Path "fe.$version.nupkg")) { throw "Chocolatey package was not created" }

      - name: Attach Chocolatey package to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: fe.*.nupkg
          fail_on_unmatched_files: true

      - name: Publish to Chocolatey Community Repository
        if: env.HAS_CHOCOLATEY_API_KEY == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: choco push (Get-ChildItem "fe.*.nupkg" | Select-Object -First 1 -ExpandProperty FullName) --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_API_KEY"

  # Dogfood Fe's own release pipeline to publish the Fe CLI binaries.
  itchio:
    name: Release Fe to itch.io using Fe
    needs: [validate-release, binaries]
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: binaries
          path: dist

      - name: Stage binaries in Fe's expected platform layout
        run: |
          set -euo pipefail
          mkdir -p builds/linux-x64 builds/linux-arm64 builds/windows-x64 builds/macos-x64 builds/macos-arm64
          install -m 0755 dist/fe-linux-amd64 builds/linux-x64/fe
          install -m 0755 dist/fe-linux-arm64 builds/linux-arm64/fe
          install -m 0755 dist/fe-windows-amd64.exe builds/windows-x64/fe.exe
          install -m 0755 dist/fe-macos-amd64 builds/macos-x64/fe
          install -m 0755 dist/fe-macos-arm64 builds/macos-arm64/fe

      - name: Install butler
        run: |
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler -V

      - name: Release Fe through Fe
        run: |
          chmod +x dist/fe-linux-amd64
          ./dist/fe-linux-amd64 release --skip-build --skip-pack --userversion "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
