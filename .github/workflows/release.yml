name: release

on:
  push:
    tags:
      - "v*"
      - "fe-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and attach assets for (for example fe-v0.0.3)"
        required: true
        type: string
      deploy_itchio:
        description: "Also run the configured game build and itch.io deployment from this repository"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: fe-linux-amd64
          - goos: linux
            goarch: arm64
            asset: fe-linux-arm64
          - goos: windows
            goarch: amd64
            asset: fe-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            asset: fe-macos-amd64
          - goos: darwin
            goarch: arm64
            asset: fe-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  deb-packages:
    name: Build Debian packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build .deb packages
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+~:-][0-9A-Za-z.+~:-]*)?$'; then
            echo "Tag must contain a Debian-compatible version (for example v1.2.3); got $RELEASE_TAG" >&2
            exit 1
          fi

          mkdir -p dist/packages
          for target in amd64 arm64; do
            package="dist/packages/fe_${version}_${target}"
            mkdir -p "$package/DEBIAN" "$package/usr/bin"
            cp "dist/fe-linux-$target" "$package/usr/bin/fe"
            chmod 0755 "$package/usr/bin/fe"
            cat > "$package/DEBIAN/control" <<EOF
          Package: fe
          Version: $version
          Section: devel
          Priority: optional
          Architecture: $target
          Maintainer: flushwhy
          Description: Local middleware CLI for game and software development
           Glue between your engine/compiler and shipping workflows.
          EOF
            dpkg-deb --root-owner-group --build "$package" "dist/fe_${version}_${target}.deb"
          done

      - name: Smoke-test clean amd64 Debian package install
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          sudo apt-get install -y "./dist/fe_${version}_amd64.deb"
          test "$(command -v fe)" = "/usr/bin/fe"
          dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' fe | grep -Fx "install ok installed ${version} amd64"
          fe --help >/dev/null
          fe o3de --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish GitHub Release assets
    needs: [binaries, deb-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify and checksum release assets
        run: |
          ls -lah dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
          sha256sum dist/fe-* dist/*.deb > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 7
          cat dist/SHA256SUMS

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Fe ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*

  chocolatey:
    name: Package Fe for Chocolatey
    needs: [binaries, github-release]
    runs-on: windows-latest
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: fe-windows-amd64.exe
          path: dist

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $version = $tag -replace '^(fe-)?v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag must be a Chocolatey-compatible version like v1.2.3; got $tag"
          }
          $binary = Resolve-Path "dist/fe-windows-amd64.exe"
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $stage = Join-Path $env:RUNNER_TEMP "fe-choco"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "tools") | Out-Null
          Copy-Item "packaging/chocolatey/fe.nuspec" (Join-Path $stage "fe.nuspec")
          Copy-Item "packaging/chocolatey/tools/chocolateyInstall.ps1" (Join-Path $stage "tools/chocolateyInstall.ps1")
          $nuspecPath = Join-Path $stage "fe.nuspec"
          $nuspec = (Get-Content $nuspecPath -Raw).Replace("__VERSION__", $version)
          Set-Content -Path $nuspecPath -Value $nuspec -NoNewline
          $installPath = Join-Path $stage "tools/chocolateyInstall.ps1"
          $install = (Get-Content $installPath -Raw).Replace("__TAG__", $tag).Replace("__SHA256__", $hash)
          Set-Content -Path $installPath -Value $install -NoNewline
          choco pack $nuspecPath --outputdirectory .
          if (!(Test-Path "fe.$version.nupkg")) { throw "Chocolatey package was not created" }

      - name: Attach Chocolatey package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: fe.*.nupkg
          fail_on_unmatched_files: true

      - name: Publish to Chocolatey Community Repository
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: choco push (Get-ChildItem "fe.*.nupkg" | Select-Object -First 1 -ExpandProperty FullName) --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_API_KEY"

  # Publish Fe itself to itch.io. The release pipeline for games is not
  # appropriate here: Fe is the product, so upload the cross-platform CLI binaries.
  itchio:
    name: Publish Fe CLI to itch.io
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage platform downloads
        run: |
          set -euo pipefail
          mkdir -p itch/linux itch/windows itch/osx
          cp dist/fe-linux-amd64 dist/fe-linux-arm64 itch/linux/
          cp dist/fe-windows-amd64.exe itch/windows/
          cp dist/fe-macos-amd64 dist/fe-macos-arm64 itch/osx/
          cat > itch/README.txt <<'EOF'
          Fe CLI downloads
          
          Linux: download the appropriate fe-linux binary for your CPU architecture and run chmod +x on it.
          Windows: run fe-windows-amd64.exe from a terminal.
          macOS: download the appropriate fe-macos binary for your CPU architecture and run chmod +x on it.
          
          Source and documentation: https://github.com/flushwhy/fe
          EOF

      - name: Install butler
        run: |
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler -V

      - name: Push Linux downloads
        run: butler push itch/linux "$ITCHIO_USERNAME/$ITCHIO_GAME:linux" --userversion "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Push Windows download
        run: butler push itch/windows "$ITCHIO_USERNAME/$ITCHIO_GAME:windows" --userversion "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Push macOS downloads
        run: butler push itch/osx "$ITCHIO_USERNAME/$ITCHIO_GAME:osx" --userversion "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
