name: release

on:
  push:
    tags:
      - "v*"
      - "fe-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to build and attach assets for (for example fe-v0.0.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate and resolve release tag
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(fe-)?v[0-9]+\.[0-9]+\.[0-9]+([.+~:-][0-9A-Za-z.+~:-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$commit" != "$GITHUB_SHA" ]]; then
            echo "The pushed tag does not resolve to the event commit." >&2
            exit 1
          fi

          # A release tag must match the manifest version on its own release line.
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          release_line="$(printf '%s' "$version" | cut -d. -f1-2)"
          manifest_version="$(git show "$commit:.release-please-manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["."])')"
          manifest_line="$(printf '%s' "$manifest_version" | cut -d. -f1-2)"
          if [[ "$release_line" != "$manifest_line" ]]; then
            echo "Tag $RELEASE_TAG does not match the version line in its release manifest ($manifest_version)." >&2
            exit 1
          fi

          # Only the version line tracked by master may publish to itch.io's stable channels.
          master_version="$(git show origin/master:.release-please-manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["."])')"
          master_line="$(printf '%s' "$master_version" | cut -d. -f1-2)"
          if [[ "$release_line" == "$master_line" ]]; then
            expected_ref="origin/master"
            itch_channel_suffix=""
          else
            expected_ref="origin/release/$release_line"
            itch_channel_suffix="${release_line//./-}"
          fi
          if ! git show-ref --verify --quiet "refs/remotes/$expected_ref"; then
            echo "No maintenance branch exists for release line $release_line." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" "$expected_ref"; then
            echo "Tag $RELEASE_TAG is not on its expected release branch ($expected_ref)." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "itch_channel_suffix=$itch_channel_suffix" >> "$GITHUB_OUTPUT"

  binaries:
    needs: validate-release
    name: Build portable release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}

      # Manual rebuilds of older tags may predate the shared build script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ inputs.tag_name != '' }}
        with:
          ref: master
          path: .build-tools

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            bash .build-tools/scripts/build-binaries.sh
          else
            bash scripts/build-binaries.sh
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  riscv-binary:
    needs: validate-release
    name: Build Linux RISC-V 64-bit binary on native hardware
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ inputs.tag_name != '' }}
        with:
          ref: master
          path: .build-tools

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: true

      - name: Test and build RISC-V binary
        env:
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          go test ./...
          mkdir -p dist
          if [ -n "$MANUAL_TAG" ]; then
            bash .build-tools/scripts/build-binaries.sh linux riscv64 fe-linux-riscv64
          else
            bash scripts/build-binaries.sh linux riscv64 fe-linux-riscv64
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fe-linux-riscv64
          path: dist/fe-linux-riscv64
          if-no-files-found: error
          retention-days: 1

  deb-packages:
    needs: [validate-release, binaries]
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    name: Build Debian packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries
          path: dist

      - name: Build Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+~:-][0-9A-Za-z.+~:-]*)?$'; then
            echo "Tag must contain a package-compatible version (for example v1.2.3); got $RELEASE_TAG" >&2
            exit 1
          fi
          bash scripts/package-linux.sh "$version"

      - name: Smoke-test clean amd64 Debian package install
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#fe-v}"
          version="${version#v}"
          package="./dist/packages/fe_${version}_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package" >/dev/null
          sudo apt install -y "$package"
          test "$(command -v fe)" = "/usr/bin/fe"
          dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' fe | grep -Fx "install ok installed ${version} amd64"
          fe --help >/dev/null
          fe o3de --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deb-packages
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  github-release:
    permissions:
      contents: write
    name: Publish GitHub Release assets
    needs: [validate-release, binaries, riscv-binary, deb-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true

      - name: Verify and checksum release assets
        run: |
          ls -lah dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 13
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 13
          cat dist/SHA256SUMS

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: Fe ${{ needs.validate-release.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  chocolatey:
    needs: [validate-release, binaries, github-release]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      HAS_CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
    name: Package Fe for Chocolatey
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries
          path: dist

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          $version = $tag -replace '^(fe-)?v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag must be a Chocolatey-compatible version like v1.2.3; got $tag"
          }
          $binary = Resolve-Path "dist/fe-windows-amd64.exe"
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $stage = Join-Path $env:RUNNER_TEMP "fe-choco"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "tools") | Out-Null
          Copy-Item "packaging/chocolatey/fe.nuspec" (Join-Path $stage "fe.nuspec")
          Copy-Item "packaging/chocolatey/tools/chocolateyInstall.ps1" (Join-Path $stage "tools/chocolateyInstall.ps1")
          $nuspecPath = Join-Path $stage "fe.nuspec"
          $nuspec = (Get-Content $nuspecPath -Raw).Replace("__VERSION__", $version)
          Set-Content -Path $nuspecPath -Value $nuspec -NoNewline
          $installPath = Join-Path $stage "tools/chocolateyInstall.ps1"
          $install = (Get-Content $installPath -Raw).Replace("__TAG__", $tag).Replace("__SHA256__", $hash)
          Set-Content -Path $installPath -Value $install -NoNewline
          choco pack $nuspecPath --outputdirectory .
          if (!(Test-Path "fe.$version.nupkg")) { throw "Chocolatey package was not created" }

      - name: Attach Chocolatey package to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          files: fe.*.nupkg
          fail_on_unmatched_files: true

      - name: Publish to Chocolatey Community Repository
        if: env.HAS_CHOCOLATEY_API_KEY == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: choco push (Get-ChildItem "fe.*.nupkg" | Select-Object -First 1 -ExpandProperty FullName) --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_API_KEY"

  # Dogfood Fe's own release pipeline to publish the Fe CLI binaries.
  itchio:
    needs: [validate-release, binaries]
    name: Release Fe to itch.io using Fe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries
          path: dist

      - name: Stage binaries in Fe's expected platform layout
        run: |
          set -euo pipefail
          mkdir -p builds/linux-x64 builds/linux-arm64 builds/windows-x64 builds/macos-x64 builds/macos-arm64
          install -m 0755 dist/fe-linux-amd64 builds/linux-x64/fe
          install -m 0755 dist/fe-linux-arm64 builds/linux-arm64/fe
          install -m 0755 dist/fe-windows-amd64.exe builds/windows-x64/fe.exe
          install -m 0755 dist/fe-macos-amd64 builds/macos-x64/fe
          install -m 0755 dist/fe-macos-arm64 builds/macos-arm64/fe

      - name: Install butler
        run: |
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler -V

      - name: Release Fe through Fe
        run: |
          chmod +x dist/fe-linux-amd64
          # This job deliberately stages release binaries in the checkout builds/ directory.
          args=(release --skip-build --skip-pack --allow-dirty --userversion "$RELEASE_TAG")
          if [ -n "$ITCH_CHANNEL_SUFFIX" ]; then
            args+=(--channel-suffix "$ITCH_CHANNEL_SUFFIX")
          fi
          ./dist/fe-linux-amd64 "${args[@]}"
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          ITCH_CHANNEL_SUFFIX: ${{ needs.validate-release.outputs.itch_channel_suffix }}
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
