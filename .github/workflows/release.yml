name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: fe-linux-amd64
          - goos: windows
            goarch: amd64
            asset: fe-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            asset: fe-macos-amd64
          - goos: darwin
            goarch: arm64
            asset: fe-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish GitHub Release assets
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets
        run: |
          ls -lah dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          name: Fe ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  chocolatey:
    name: Package Fe for Chocolatey
    needs: [binaries, github-release]
    runs-on: windows-latest
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fe-windows-amd64.exe
          path: dist

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag must be a Chocolatey-compatible version like v1.2.3; got ${{ github.ref_name }}"
          }
          $binary = Resolve-Path "dist/fe-windows-amd64.exe"
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $stage = Join-Path $env:RUNNER_TEMP "fe-choco"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "tools") | Out-Null
          Copy-Item "packaging/chocolatey/fe.nuspec" (Join-Path $stage "fe.nuspec")
          Copy-Item "packaging/chocolatey/tools/chocolateyInstall.ps1" (Join-Path $stage "tools/chocolateyInstall.ps1")
          $nuspecPath = Join-Path $stage "fe.nuspec"
          $nuspec = (Get-Content $nuspecPath -Raw).Replace("__VERSION__", $version)
          Set-Content -Path $nuspecPath -Value $nuspec -NoNewline
          $installPath = Join-Path $stage "tools/chocolateyInstall.ps1"
          $install = (Get-Content $installPath -Raw).Replace("__VERSION__", $version).Replace("__SHA256__", $hash)
          Set-Content -Path $installPath -Value $install -NoNewline
          choco pack $nuspecPath --outputdirectory .
          if (!(Test-Path "fe.$version.nupkg")) { throw "Chocolatey package was not created" }

      - name: Attach Chocolatey package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fe.*.nupkg
          fail_on_unmatched_files: true

      - name: Publish to Chocolatey Community Repository
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: choco push (Get-ChildItem "fe.*.nupkg" | Select-Object -First 1 -ExpandProperty FullName) --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_API_KEY"

  # Keep the existing itch.io deployment, but build the CLI from this tag
  # instead of downloading the previous GitHub release's binary.
  itchio:
    name: Deploy configured game builds to itch.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Build Fe CLI
        run: go build -trimpath -o ./fe .

      - name: Install butler
        run: |
          curl -fsSL https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate config
        run: ./fe validate
        env:
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}

      - name: Deploy to itch.io
        run: ./fe release --userversion "${{ github.ref_name }}"
        env:
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
