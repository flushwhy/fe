name: rolling-release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for release-relevant changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Compare with the previous rolling release
        id: check
        run: |
          if ! git rev-parse --verify refs/tags/rolling >/dev/null 2>&1; then
            echo "No previous rolling tag; publish the initial rolling release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet refs/tags/rolling HEAD -- . \
            ':(exclude)docs/**' \
            ':(exclude)**/*.md' \
            ':(exclude)readme.md' \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)LICENSE' \
            ':(exclude).release-please-manifest.json'; then
            echo "No release-relevant changes since the last rolling release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release-relevant changes found."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  arm64-packages:
    if: needs.check-changes.outputs.changed == 'true'
    needs: check-changes
    name: Build ARM64 Linux packages natively
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build ARM64 binary and packages
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/fe-linux-arm64 .
          sudo apt-get update
          sudo apt-get install -y rpm
          tags="$(git tag --list | sed -E 's/^(fe-)?v//' | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V)"
          if [ -z "$tags" ]; then echo "No stable semver release tags found" >&2; exit 1; fi
          latest="$(echo "$tags" | tail -n 1)"
          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          version="$major.$minor.$((patch + 1))"
          bash scripts/package-linux.sh "$version" "rolling.g${GITHUB_SHA:0:7}" arm64

      - uses: actions/upload-artifact@v4
        with:
          name: fe-linux-arm64-packages
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  rolling:
    name: Build and publish rolling release
    needs: [check-changes, arm64-packages]
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - uses: actions/download-artifact@v4
        with:
          name: fe-linux-arm64-packages
          path: dist/packages

      - name: Build binaries and Linux packages
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/fe-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/fe-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/fe-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/fe-macos-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/fe-macos-arm64 .

          sudo apt-get update
          sudo apt-get install -y rpm
          tags="$(git tag --list | sed -E 's/^(fe-)?v//' | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V)"
          if [ -z "$tags" ]; then echo "No stable semver release tags found" >&2; exit 1; fi
          latest="$(echo "$tags" | tail -n 1)"
          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          version="$major.$minor.$((patch + 1))"
          bash scripts/package-linux.sh "$version" "rolling.g${GITHUB_SHA:0:7}" amd64
          cp dist/packages/* dist/
          sha256sum dist/fe-* dist/*.deb dist/*.rpm dist/*.tar.gz > dist/SHA256SUMS

      - name: Remove stale assets from the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/rolling" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].id' | while IFS= read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: Update rolling GitHub Release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Fe Rolling Release
          body: |
            Automatically updated from the latest successful build of `master`.

            This is the continuously updated development channel. For stable releases, see the versioned releases.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/fe-linux-amd64
            dist/fe-linux-arm64
            dist/fe-windows-amd64.exe
            dist/fe-macos-amd64
            dist/fe-macos-arm64
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Install butler
        run: |
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler -V

      - name: Publish rolling channels through Fe
        run: |
          mkdir -p builds/linux-x64 builds/linux-arm64 builds/windows-x64 builds/macos-x64 builds/macos-arm64
          install -m 0755 dist/fe-linux-amd64 builds/linux-x64/fe
          install -m 0755 dist/fe-linux-arm64 builds/linux-arm64/fe
          install -m 0644 dist/fe-windows-amd64.exe builds/windows-x64/fe.exe
          install -m 0755 dist/fe-macos-amd64 builds/macos-x64/fe
          install -m 0755 dist/fe-macos-arm64 builds/macos-arm64/fe
          ./dist/fe-linux-amd64 release --skip-build --skip-pack --channel-suffix rolling --userversion "rolling-${GITHUB_SHA::7}"
        env:
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
