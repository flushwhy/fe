name: rolling-release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for release-relevant changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0

      - name: Compare tool source with the previous rolling release
        id: check
        run: |
          if ! git rev-parse --verify refs/tags/rolling >/dev/null 2>&1; then
            echo "No previous rolling tag; publish the initial rolling release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only refs/tags/rolling HEAD \
            | grep -E '(^|/)[^/]+\.go$|^go\.(mod|sum)$' \
            | grep -Ev '(^|/)[^/]+_test\.go$'; then
            echo "Fe source or Go dependencies changed since the last rolling release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Fe source or Go dependency changes since the last rolling release; skipping publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  arm64-packages:
    if: needs.check-changes.outputs.changed == 'true'
    needs: check-changes
    name: Build ARM64 Linux packages natively
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: true

      - name: Build ARM64 binary and packages
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=rolling bash scripts/build-binaries.sh linux arm64 fe-linux-arm64
          sudo apt-get update
          sudo apt-get install -y rpm
          tags="$(git tag --list | sed -E 's/^(fe-)?v//' | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V)"
          if [ -z "$tags" ]; then echo "No stable semver release tags found" >&2; exit 1; fi
          latest="$(echo "$tags" | tail -n 1)"
          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          version="$major.$minor.$((patch + 1))"
          bash scripts/package-linux.sh "$version" "rolling.g${GITHUB_SHA:0:7}" arm64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fe-linux-arm64-packages
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 1

  riscv-binary:
    if: needs.check-changes.outputs.changed == 'true'
    needs: check-changes
    name: Build Linux RISC-V 64-bit binary on native hardware
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: true

      - name: Test and build RISC-V binary
        run: |
          set -euo pipefail
          go test ./...
          mkdir -p dist
          VERSION=rolling bash scripts/build-binaries.sh linux riscv64 fe-linux-riscv64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fe-linux-riscv64
          path: dist/fe-linux-riscv64
          if-no-files-found: error
          retention-days: 1

  rolling:
    name: Build and publish rolling release
    permissions:
      contents: write
    needs: [check-changes, arm64-packages, riscv-binary]
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.10"
          cache: true

      - name: Test
        run: go test ./...

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fe-linux-arm64-packages
          path: dist/packages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fe-linux-riscv64
          path: dist

      - name: Build binaries and Linux packages
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=rolling bash scripts/build-binaries.sh

          sudo apt-get update
          sudo apt-get install -y rpm
          tags="$(git tag --list | sed -E 's/^(fe-)?v//' | grep -E '^[0-9]+[.][0-9]+[.][0-9]+$' | sort -V)"
          if [ -z "$tags" ]; then echo "No stable semver release tags found" >&2; exit 1; fi
          latest="$(echo "$tags" | tail -n 1)"
          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          version="$major.$minor.$((patch + 1))"
          bash scripts/package-linux.sh "$version" "rolling.g${GITHUB_SHA:0:7}" amd64
          cp dist/packages/* dist/
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS

      - name: Update rolling GitHub Release page
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: rolling
          name: Fe Rolling Release
          body: |
            Automatically updated from the latest successful build of `master`.

            This is the continuously updated development channel. For stable releases, see the versioned releases.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/fe-linux-amd64
            dist/fe-linux-arm64
            dist/fe-linux-riscv64
            dist/fe-windows-amd64.exe
            dist/fe-macos-amd64
            dist/fe-macos-arm64
            dist/fe-freebsd-amd64
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Remove stale assets after successful upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/rolling" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[] | [.id, .name] | @tsv' |
            while IFS="$(printf '\t')" read -r asset_id asset_name; do
              [ -n "$asset_id" ] || continue
              if [ ! -f "dist/$asset_name" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              fi
            done

      - name: Install butler
        run: |
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/
          butler -V

      - name: Publish rolling channels through Fe
        run: |
          mkdir -p builds/linux-x64 builds/linux-arm64 builds/windows-x64 builds/macos-x64 builds/macos-arm64
          install -m 0755 dist/fe-linux-amd64 builds/linux-x64/fe
          install -m 0755 dist/fe-linux-arm64 builds/linux-arm64/fe
          install -m 0644 dist/fe-windows-amd64.exe builds/windows-x64/fe.exe
          install -m 0755 dist/fe-macos-amd64 builds/macos-x64/fe
          install -m 0755 dist/fe-macos-arm64 builds/macos-arm64/fe
          ./dist/fe-linux-amd64 release --skip-build --skip-pack --channel-suffix rolling --userversion "rolling-${GITHUB_SHA::7}"
        env:
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Mark this commit as the last successful rolling release
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/tags/rolling
