name: CI

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out project templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: flushwhy/fe-templates
          ref: main
          path: fe-templates

      - name: Validate shipped project templates
        run: python3 scripts/validate-templates.py fe-templates

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go module files are tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test ./...

      - name: Run Go static analysis
        run: go vet ./...

      - name: Build portable release targets
        run: bash scripts/build-binaries.sh

      - name: Test Linux package architectures
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh 0.0.0
          test "$(rpm -qp --qf '%{ARCH}' dist/packages/fe-0.0.0-x86_64.rpm)" = x86_64
          test "$(rpm -qp --qf '%{ARCH}' dist/packages/fe-0.0.0-aarch64.rpm)" = aarch64
          test "$(rpm -qp --qf '%{LICENSE}' dist/packages/fe-0.0.0-x86_64.rpm)" = GPL-3.0-only
          package="./dist/packages/fe_0.0.0_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package" >/dev/null
          sudo apt install -y "$package"
          dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' fe | grep -Fx "install ok installed 0.0.0 amd64"
          test "$(command -v fe)" = "/usr/bin/fe"
          fe --help >/dev/null
          fe o3de --help >/dev/null
  docs-site:
    name: Validate documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate HTML and embedded JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.scripts = []
                  self.in_script = False
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.current = []

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("\n".join(self.current))
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

          source = Path("docs/site/index.html").read_text(encoding="utf-8")
          parser = SiteParser()
          parser.feed(source)
          parser.close()
          if not parser.scripts:
              raise SystemExit("No embedded JavaScript block found")
          Path("/tmp/fe-site.js").write_text("\n".join(parser.scripts), encoding="utf-8")
          print("HTML parsed; embedded JavaScript extracted.")
          PY
          node --check /tmp/fe-site.js

  windows-command-safety:
    name: Windows command safety
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test O3DE Windows batch argument handling
        run: go test ./internal/o3de -run 'TestCLIInvocation' -count=1
