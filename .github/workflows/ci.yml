name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go module files are tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test ./...

      - name: Run Go static analysis
        run: go vet ./...

      - name: Build portable release targets
        run: bash scripts/build-binaries.sh

      - name: Test Linux package architectures
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh 0.0.0
          test "$(rpm -qp --qf '%{ARCH}' dist/packages/fe-0.0.0-x86_64.rpm)" = x86_64
          test "$(rpm -qp --qf '%{ARCH}' dist/packages/fe-0.0.0-aarch64.rpm)" = aarch64
          package="./dist/packages/fe_0.0.0_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package" >/dev/null
          sudo apt-get install -y "$package"
          dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' fe | grep -Fx "install ok installed 0.0.0 amd64"
          test "$(command -v fe)" = "/usr/bin/fe"
          fe --help >/dev/null
          fe o3de --help >/dev/null
