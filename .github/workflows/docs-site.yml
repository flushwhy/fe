name: Deploy documentation site

on:
  push:
    branches: [master]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate HTML and embedded JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.scripts = []
                  self.in_script = False
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.current = []

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("\\n".join(self.current))
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

          source = Path("docs/site/index.html").read_text(encoding="utf-8")
          parser = SiteParser()
          parser.feed(source)
          parser.close()
          if not parser.scripts:
              raise SystemExit("No embedded JavaScript block found")
          Path("/tmp/fe-site.js").write_text("\\n".join(parser.scripts), encoding="utf-8")
          print("HTML parsed; embedded JavaScript extracted.")
          PY
          node --check /tmp/fe-site.js

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
